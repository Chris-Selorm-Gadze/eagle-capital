<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EagleCapital — Trading Desk for Multi-Account Traders</title>
    <meta
      name="description"
      content="Track prop-firm and live broker accounts in one dashboard. Trade journal, live MT5 sync, trade copier and pattern detection. No firm's rules hardcoded. Start free."
    />

    <!-- Gloock is landing-only, so it stays on the CDN. Manrope is bundled
         instead (@fontsource-variable/manrope, imported by index.css) because
         the app needs it too and shouldn't block on a third party for its
         body text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Every account. One desk." />
    <meta
      property="og:description"
      content="Prop-firm evaluations, funded accounts and live broker accounts side by side — with a real journal, live sync and order copying."
    />
    <!-- `summary` not `summary_large_image`: the large-image card renders blank
         without an og:image, which is worse than no card at all. Switch this
         back the same day an og:image ships (see later.txt). -->
    <meta name="twitter:card" content="summary" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#faf9f7" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Applies the theme class BEFORE first paint. The module script below is
         deferred by definition, so leaving this to React means a dark-mode user
         sees one white frame on every cold load — the flash the rest of the
         theme work exists to avoid. Deliberately inline, tiny, and duplicated in
         src/lib/theme.ts: the storage key and class name are the contract
         between the two. Wrapped because localStorage throws outright in a
         locked-down context rather than returning null. -->
    <script>
      (function () {
        try {
          var stored = null
          try { stored = localStorage.getItem('eaglecapital-theme') } catch (e) {}
          var dark = stored === 'dark' || (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.content = '#0a0a0a'
          }
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
