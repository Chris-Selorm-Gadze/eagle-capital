  <head>

      content="Prop-firm evaluations, funded accounts and live broker accounts side by side — with a real journal, live sync and order copying."

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
